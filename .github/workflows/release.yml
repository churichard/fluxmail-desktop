name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/fluxmail.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/fluxmail-signing.keychain-db"
          echo "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Prepare notarization key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - run: pnpm build:mcp
      - name: Make signed DMG
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          FLUXMAIL_DESKTOP_GOOGLE_CLIENT_ID: ${{ secrets.FLUXMAIL_DESKTOP_GOOGLE_CLIENT_ID }}
          FLUXMAIL_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.FLUXMAIL_DESKTOP_GOOGLE_CLIENT_SECRET }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-forge make --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluxmail-${{ matrix.arch }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fluxmail-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' artifacts < <(find release -type f \( -name '*.dmg' -o -name '*.zip' \) -print0)
          test "${#artifacts[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" --generate-notes --verify-tag
